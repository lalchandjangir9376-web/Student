<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>लॉगिन पेज</title>
</head>
<body>
    <h2>छात्र लॉगिन</h2>
    <form>
        <label for="name">नाम:</label>
        <input type="text" id="name" required><br><br>
        
        <label for="year">शैक्षणिक वर्ष:</label>
        <input type="text" id="year" required><br><br>
        <label for="school">स्कूल के घंटे:</label>
<input type="text" id="school" required><br><br>

<label for="wake">उठने का समय:</label>
<input type="text" id="wake" required><br><br>
      <label for="study">स्व-अध्ययन के घंटे:</label>
<input type="text" id="study" required><br><br>

<label for="weak">कमजोर विषय:</label>
<input type="text" id="weak" required><br><br>
      
        <button type="submit">अगला</button>
    </form>
</body>
</html>
